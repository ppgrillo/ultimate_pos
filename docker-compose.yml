services:
  # Service key MUST equal container_name: this project shares the external `proxy`
  # network with ovejaposDEV, and a generic key like `backend` would register the
  # same DNS alias in both stacks, making `backend:3001` resolve round-robin to
  # either environment. That caused the 2026-09-26 outage.
  ovejapos-prd-backend:
    container_name: ovejapos-prd-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    restart: always
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CORS_ORIGIN=https://ovejapos.ovejasautomaticas.com
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - GOOGLE_SERVICE_ACCOUNT_PATH=/app/certs/service-account-key.json
      - GOOGLE_WALLET_ISSUER_ID=${GOOGLE_WALLET_ISSUER_ID}
      - APPLE_PASS_TYPE_IDENTIFIER=${APPLE_PASS_TYPE_IDENTIFIER}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_PASS_KEY_PASSPHRASE=${APPLE_PASS_KEY_PASSPHRASE}
      - APPLE_WALLET_WEB_SERVICE_URL=${APPLE_WALLET_WEB_SERVICE_URL}
      - APPLE_APNS_KEY_ID=${APPLE_APNS_KEY_ID}
      - APPLE_APNS_P8_PATH=${APPLE_APNS_P8_PATH}
      - APPLE_APNS_USE_DEVELOPMENT=${APPLE_APNS_USE_DEVELOPMENT}
      - ACTIVE_PAYMENT_PROVIDER=${ACTIVE_PAYMENT_PROVIDER}
      - CLIP_API_KEY=${CLIP_API_KEY}
      - CLIP_API_SECRET=${CLIP_API_SECRET}
      - GETNET_MERCHANT_ID=${GETNET_MERCHANT_ID}
      - GETNET_API_KEY=${GETNET_API_KEY}
      - MP_CLIENT_SECRET=${MP_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_API_URL=https://api-ovejapos.ovejasautomaticas.com
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ovejapos-prd-api.rule=Host(`api-ovejapos.ovejasautomaticas.com`)"
      - "traefik.http.routers.ovejapos-prd-api.entrypoints=websecure"
      - "traefik.http.routers.ovejapos-prd-api.tls.certresolver=myresolver"
      - "traefik.http.services.ovejapos-prd-api.loadbalancer.server.port=3001"

  ovejapos-prd-frontend:
    container_name: ovejapos-prd-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://ovejapos-prd-backend:3001
      - NEXTAUTH_URL=https://ovejapos.ovejasautomaticas.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    depends_on:
      - ovejapos-prd-backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ovejapos-prd-frontend.rule=Host(`ovejapos.ovejasautomaticas.com`)"
      - "traefik.http.routers.ovejapos-prd-frontend.entrypoints=websecure"
      - "traefik.http.routers.ovejapos-prd-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.ovejapos-prd-frontend.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
